<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebGL Forest // JOBOSU</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    background: #000;
    color: white;
    font-family: monospace;
}

body {
    height: 600vh;
}

#scene {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#interface {
    position: fixed;
    inset: 0;
    padding: 40px;
    pointer-events: none;
    z-index: 10;
}

.title {
    letter-spacing: 4px;
    font-size: 14px;
}

.status {
    color: #79ff79;
    margin-top: 12px;
    font-size: 12px;
}

.scroll {
    position: absolute;
    right: 40px;
    bottom: 40px;
    letter-spacing: 3px;
    font-size: 11px;
    opacity: .7;
}

#phase {
    position: absolute;
    left: 40px;
    bottom: 40px;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .6;
}

#progress {
    position: fixed;
    left: 0;
    top: 0;
    height: 2px;
    width: 0;
    background: #79ff79;
    z-index: 20;
}

@media (max-width: 600px) {
    #interface {
        padding: 22px;
    }

    .scroll {
        right: 22px;
        bottom: 22px;
    }

    #phase {
        left: 22px;
        bottom: 22px;
    }
}
</style>
</head>

<body>

<div id="progress"></div>
<div id="scene"></div>

<div id="interface">

    <div class="title">
        JOBOSU // WEBGL FOREST
    </div>

    <div class="status">
        ● REALTIME ENVIRONMENT
    </div>

    <div id="phase">
        FOREST // 01
    </div>

    <div class="scroll">
        SCROLL ↓
    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* ---------------------------------------------
   SCENE
--------------------------------------------- */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x03070a);

scene.fog =
    new THREE.FogExp2(
        0x071116,
        0.028
    );


/* ---------------------------------------------
   CAMERA
--------------------------------------------- */

const camera =
    new THREE.PerspectiveCamera(
        62,
        innerWidth / innerHeight,
        0.1,
        400
    );

camera.position.set(0, 4.5, 20);


/* ---------------------------------------------
   RENDERER
--------------------------------------------- */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 0.75;

document
    .getElementById("scene")
    .appendChild(renderer.domElement);


/* ---------------------------------------------
   LIGHT
--------------------------------------------- */

const hemisphere =
    new THREE.HemisphereLight(
        0x63829b,
        0x071008,
        1.1
    );

scene.add(hemisphere);


const sun =
    new THREE.DirectionalLight(
        0xffa45f,
        2.5
    );

sun.position.set(
    -20,
    25,
    -40
);

sun.castShadow = true;

sun.shadow.mapSize.set(
    1024,
    1024
);

scene.add(sun);


/* ---------------------------------------------
   TERRAIN
--------------------------------------------- */

function terrainHeight(x, z) {

    return (
        Math.sin(x * 0.11) * 0.55 +
        Math.sin(z * 0.055) * 0.8 +
        Math.sin((x + z) * 0.035) * 0.5
    );
}


const terrainGeometry =
    new THREE.PlaneGeometry(
        100,
        260,
        80,
        180
    );


terrainGeometry.rotateX(
    -Math.PI / 2
);


const position =
    terrainGeometry.attributes.position;


for (
    let i = 0;
    i < position.count;
    i++
) {

    const x = position.getX(i);
    const z = position.getZ(i);

    position.setY(
        i,
        terrainHeight(x, z)
    );
}


terrainGeometry.computeVertexNormals();


const terrainMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x071209,
        roughness: 1
    });


const terrain =
    new THREE.Mesh(
        terrainGeometry,
        terrainMaterial
    );


terrain.position.z = -105;

terrain.receiveShadow = true;

scene.add(terrain);


/* ---------------------------------------------
   TREE MATERIALS
--------------------------------------------- */

const trunkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x28170d,
        roughness: 1
    });


const foliageMaterials = [

    new THREE.MeshStandardMaterial({
        color: 0x0b1c12,
        roughness: 1
    }),

    new THREE.MeshStandardMaterial({
        color: 0x102818,
        roughness: 1
    }),

    new THREE.MeshStandardMaterial({
        color: 0x152d1d,
        roughness: 1
    })

];


/* ---------------------------------------------
   TREE
--------------------------------------------- */

function createTree(
    x,
    z,
    scale,
    rotation
) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.16 * scale,
                0.30 * scale,
                4.5 * scale,
                7
            ),

            trunkMaterial
        );


    trunk.position.y =
        2.25 * scale;

    trunk.castShadow = true;

    tree.add(trunk);


    const material =
        foliageMaterials[
            Math.floor(
                Math.random() *
                foliageMaterials.length
            )
        ];


    const levels =
        4 +
        Math.floor(
            Math.random() * 2
        );


    for (
        let i = 0;
        i < levels;
        i++
    ) {

        const cone =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    (
                        2.3 -
                        i * 0.25
                    ) * scale,

                    3.3 * scale,

                    7
                ),

                material
            );


        cone.position.y =
            (
                3.3 +
                i * 1.25
            ) * scale;


        cone.rotation.y =
            Math.random() *
            Math.PI;


        cone.castShadow = true;

        tree.add(cone);
    }


    tree.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ),
        z
    );


    tree.rotation.y =
        rotation;


    scene.add(tree);
}


/* ---------------------------------------------
   FOREST
--------------------------------------------- */

for (
    let i = 0;
    i < 260;
    i++
) {

    const side =
        Math.random() > 0.5
            ? 1
            : -1;


    /*
       Keep the centre relatively clear
       so the camera has a path.
    */

    const x =
        side *
        (
            4.5 +
            Math.random() * 38
        );


    const z =
        15 -
        Math.random() * 230;


    const scale =
        0.65 +
        Math.random() * 1.65;


    createTree(
        x,
        z,
        scale,
        Math.random() *
        Math.PI * 2
    );
}


/* ---------------------------------------------
   FOREGROUND TREES
--------------------------------------------- */

for (
    let i = 0;
    i < 20;
    i++
) {

    const side =
        Math.random() > 0.5
            ? 1
            : -1;


    createTree(

        side *
        (
            2.8 +
            Math.random() * 5
        ),

        12 -
        Math.random() * 220,

        1.3 +
        Math.random() * 1.4,

        Math.random() *
        Math.PI * 2
    );
}


/* ---------------------------------------------
   MIST LAYERS
--------------------------------------------- */

const mistLayers = [];


function createMistLayer(
    y,
    z,
    opacity,
    scale
) {

    const material =
        new THREE.MeshBasicMaterial({

            color: 0xaabcc3,

            transparent: true,

            opacity: opacity,

            depthWrite: false,

            side:
                THREE.DoubleSide
        });


    const geometry =
        new THREE.PlaneGeometry(
            70 * scale,
            18 * scale
        );


    const mist =
        new THREE.Mesh(
            geometry,
            material
        );


    mist.position.set(
        0,
        y,
        z
    );


    mist.rotation.x =
        -Math.PI / 2;


    scene.add(mist);

    mistLayers.push(mist);
}


for (
    let i = 0;
    i < 18;
    i++
) {

    createMistLayer(

        0.7 +
        Math.random() * 2,

        10 -
        i * 13,

        0.018 +
        Math.random() * 0.025,

        0.8 +
        Math.random() * 1.3
    );
}


/* ---------------------------------------------
   AIR PARTICLES
--------------------------------------------- */

const particleCount = 900;

const particleGeometry =
    new THREE.BufferGeometry();

const particles =
    new Float32Array(
        particleCount * 3
    );


for (
    let i = 0;
    i < particleCount;
    i++
) {

    particles[
        i * 3
    ] =
        (
            Math.random() -
            0.5
        ) * 65;


    particles[
        i * 3 + 1
    ] =
        Math.random() * 12;


    particles[
        i * 3 + 2
    ] =
        20 -
        Math.random() * 250;
}


particleGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        particles,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color: 0xdce8e8,

        size: 0.07,

        transparent: true,

        opacity: 0.35,

        depthWrite: false
    });


const air =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );


scene.add(air);


/* ---------------------------------------------
   POINTER
--------------------------------------------- */

let pointerX = 0;
let pointerY = 0;


addEventListener(
    "pointermove",
    event => {

        pointerX =
            event.clientX /
            innerWidth -
            0.5;

        pointerY =
            event.clientY /
            innerHeight -
            0.5;
    }
);


/* ---------------------------------------------
   SCROLL
--------------------------------------------- */

let scrollProgress = 0;


function updateScroll() {

    const maximum =
        document.documentElement
            .scrollHeight -
        innerHeight;


    scrollProgress =
        maximum > 0
            ? scrollY / maximum
            : 0;


    document
        .getElementById(
            "progress"
        )
        .style.width =
            (
                scrollProgress *
                100
            ) +
            "%";


    /*
       Change label according
       to position in forest.
    */

    const phase =
        document.getElementById(
            "phase"
        );


    if (
        scrollProgress < 0.33
    ) {

        phase.textContent =
            "FOREST // COLD";

    } else if (
        scrollProgress < 0.70
    ) {

        phase.textContent =
            "FOREST // MIST";

    } else {

        phase.textContent =
            "FOREST // LIGHT";
    }
}


addEventListener(
    "scroll",
    updateScroll,
    { passive: true }
);


/* ---------------------------------------------
   COLOURS
--------------------------------------------- */

const coldFog =
    new THREE.Color(
        0x071116
    );


const warmFog =
    new THREE.Color(
        0x39231c
    );


const coldSky =
    new THREE.Color(
        0x020609
    );


const warmSky =
    new THREE.Color(
        0x21100c
    );


/* ---------------------------------------------
   ANIMATION
--------------------------------------------- */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /*
       Camera journey
    */

    const targetZ =
        20 -
        scrollProgress * 205;


    camera.position.z +=
        (
            targetZ -
            camera.position.z
        ) * 0.035;


    /*
       Pointer parallax
    */

    const targetX =
        pointerX * 2.3;


    camera.position.x +=
        (
            targetX -
            camera.position.x
        ) * 0.025;


    const groundY =
        terrainHeight(
            camera.position.x,
            camera.position.z + 105
        );


    const targetY =
        groundY +
        4.2 -
        pointerY * 0.8;


    camera.position.y +=
        (
            targetY -
            camera.position.y
        ) * 0.035;


    /*
       Slight walking movement
    */

    camera.position.y +=
        Math.sin(
            time * 1.2
        ) * 0.0015;


    /*
       Moving mist
    */

    mistLayers.forEach(
        (mist, index) => {

            mist.position.x =
                Math.sin(
                    time *
                    (
                        0.035 +
                        index * 0.001
                    ) +
                    index
                ) *
                (
                    4 +
                    index * 0.15
                );
        }
    );


    air.position.x =
        Math.sin(
            time * 0.08
        ) * 2;


    /*
       Scroll controls atmosphere
    */

    scene.fog.color
        .lerpColors(
            coldFog,
            warmFog,
            scrollProgress
        );


    scene.background
        .lerpColors(
            coldSky,
            warmSky,
            scrollProgress
        );


    sun.color.setHSL(
        0.08 -
        scrollProgress * 0.03,
        0.75,
        0.62
    );


    sun.intensity =
        1.5 +
        scrollProgress * 4;


    sun.position.x =
        -25 +
        scrollProgress * 45;


    sun.position.y =
        14 +
        scrollProgress * 18;


    renderer.toneMappingExposure =
        0.65 +
        scrollProgress * 0.55;


    /*
       Look further into forest
    */

    camera.lookAt(
        camera.position.x * 0.15,
        camera.position.y - 0.5,
        camera.position.z - 25
    );


    renderer.render(
        scene,
        camera
    );
}


updateScroll();
animate();


/* ---------------------------------------------
   RESIZE
--------------------------------------------- */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera
            .updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
