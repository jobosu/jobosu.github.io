<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="JOBOSU EXP 001 — realtime WebGL forest built with Three.js.">
<title>EXP 001 — WebGL Forest // JOBOSU</title>
<style>
*{box-sizing:border-box} html,body{margin:0;background:#020504;color:#eaf2ec;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} body{height:650vh;overflow-x:hidden} #stage{position:fixed;inset:0;background:#020504} canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none;padding:clamp(20px,4vw,44px);text-shadow:0 1px 10px #000} .kicker{font-size:12px;letter-spacing:.24em}.live{margin-top:10px;color:#83ff9d;font-size:11px;letter-spacing:.12em}.hint{position:absolute;right:clamp(20px,4vw,44px);bottom:clamp(20px,4vw,40px);font-size:10px;letter-spacing:.2em;opacity:.65}.phase{position:absolute;left:clamp(20px,4vw,44px);bottom:clamp(20px,4vw,40px);font-size:10px;letter-spacing:.2em;opacity:.55} #bar{position:fixed;z-index:7;top:0;left:0;width:0;height:2px;background:#7dff96;box-shadow:0 0 12px #7dff96} #loader{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#020504;transition:opacity .8s ease}.loadbox{width:min(340px,75vw)}.loadtitle{font-size:12px;letter-spacing:.2em;margin-bottom:14px}.track{height:1px;background:#233029}.fill{height:100%;width:0;background:#7dff96;transition:width .2s}.loadpct{font-size:10px;opacity:.55;margin-top:10px}.credit{position:fixed;z-index:6;right:12px;top:12px;font-size:8px;opacity:.25;pointer-events:none}
@media(max-width:650px){.credit{display:none}.kicker{font-size:10px}.live{font-size:9px}}
</style>
</head>
<body>
<div id="stage"></div><div id="bar"></div>
<div id="ui"><div class="kicker">JOBOSU // EXP 001</div><div class="live">● REALTIME WEBGL ENVIRONMENT</div><div class="phase" id="phase">FOREST // ENTRY</div><div class="hint">SCROLL ↓</div></div>
<div id="loader"><div class="loadbox"><div class="loadtitle">LOADING FOREST</div><div class="track"><div class="fill" id="fill"></div></div><div class="loadpct" id="loadpct">0%</div></div></div>
<div class="credit">3D ASSETS: QUATERNIUS · CC0</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const mobile=matchMedia('(max-width:700px)').matches;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const scene=new THREE.Scene();
const cold=new THREE.Color(0x07100d), warm=new THREE.Color(0x2b1b11);
scene.background=cold.clone(); scene.fog=new THREE.FogExp2(cold.clone(),mobile?.032:.027);
const camera=new THREE.PerspectiveCamera(mobile?66:61,innerWidth/innerHeight,.1,260); camera.position.set(0,3.2,16);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.25:1.6)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.72; renderer.shadowMap.enabled=!mobile; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.querySelector('#stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x8aa49a,0x101008,1.15));
const sun=new THREE.DirectionalLight(0xffc07a,2.0); sun.position.set(-18,24,-35); if(!mobile){sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-10} scene.add(sun);

function h(x,z){return Math.sin(x*.12)*.32+Math.sin(z*.055)*.48+Math.sin((x+z)*.038)*.25}
const tg=new THREE.PlaneGeometry(72,230,34,110); tg.rotateX(-Math.PI/2); const pa=tg.attributes.position; for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i);pa.setY(i,h(x,z))} tg.computeVertexNormals(); const terrain=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({color:0x10160e,roughness:1})); terrain.position.z=-94; terrain.receiveShadow=!mobile; scene.add(terrain);

const loader=new GLTFLoader(), manager=THREE.DefaultLoadingManager; const fill=document.querySelector('#fill'),pct=document.querySelector('#loadpct'); manager.onProgress=(u,l,t)=>{const p=Math.round(l/t*100);fill.style.width=p+'%';pct.textContent=p+'%'};
const load=url=>new Promise((res,rej)=>loader.load(url,g=>res(g.scene),undefined,rej));
const A='./assets/';
const [pine1,pine3,pine5,fern,grass,rock1,rock2]=await Promise.all(['Pine_1.gltf','Pine_3.gltf','Pine_5.gltf','Fern_1.gltf','Grass_Common_Short.gltf','Rock_Medium_1.gltf','Rock_Medium_2.gltf'].map(x=>load(A+x)));
[pine1,pine3,pine5].forEach(root=>root.traverse(o=>{if(o.isMesh){o.castShadow=!mobile;o.receiveShadow=!mobile;if(o.material){o.material.alphaTest=.35;o.material.side=THREE.DoubleSide}}}));
[fern,grass].forEach(root=>root.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;if(o.material){o.material.alphaTest=.4;o.material.side=THREE.DoubleSide}}}));
[rock1,rock2].forEach(root=>root.traverse(o=>{if(o.isMesh){o.castShadow=!mobile;o.receiveShadow=!mobile}}));

function seeded(n){const x=Math.sin(n*9283.17)*43758.5453;return x-Math.floor(x)}
const treeModels=[pine1,pine3,pine5], treeCount=mobile?62:92;
for(let i=0;i<treeCount;i++){const r1=seeded(i+1),r2=seeded(i+101),r3=seeded(i+301); const side=r1>.5?1:-1; let x=side*(4.3+r2*24); const z=10-r3*205; // clearings for text
 if((z<-47&&z>-72)||(z<-120&&z>-143)) x*=1.28;
 const t=treeModels[i%3].clone(true),s=.72+seeded(i+501)*1.15; t.scale.setScalar(s);t.rotation.y=seeded(i+701)*Math.PI*2;t.rotation.z=(seeded(i+801)-.5)*.035;t.position.set(x,h(x,z+94),z);scene.add(t)}
const plantCount=mobile?45:90; for(let i=0;i<plantCount;i++){const z=8-seeded(i+900)*205,x=(seeded(i+1000)-.5)*32;if(Math.abs(x)<2.2)continue;const p=(i%3===0?fern:grass).clone(true),s=.45+seeded(i+1100)*.75;p.scale.setScalar(s);p.rotation.y=seeded(i+1200)*6.28;p.position.set(x,h(x,z+94)+.03,z);scene.add(p)}
for(let i=0;i<(mobile?14:24);i++){const z=4-seeded(i+1300)*200,x=(seeded(i+1400)-.5)*28;if(Math.abs(x)<2.8)continue;const r=(i%2?rock1:rock2).clone(true),s=.5+seeded(i+1500)*1.4;r.scale.setScalar(s);r.rotation.y=seeded(i+1600)*6.28;r.position.set(x,h(x,z+94),z);scene.add(r)}

// 3D text sprites: depth-tested, so trunks and foliage can pass in front.
function textSprite(lines,z,y=5.2,scale=1){const c=document.createElement('canvas');c.width=1400;c.height=420;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.textAlign='center';x.textBaseline='middle';x.font='600 68px monospace';x.letterSpacing='5px';x.fillStyle='rgba(235,244,238,.96)';lines.forEach((line,i)=>x.fillText(line,700,155+i*92));const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:true,depthWrite:false,opacity:0});const sp=new THREE.Sprite(mat);sp.position.set(0,y,z);sp.scale.set(16*scale,4.8*scale,1);scene.add(sp);return sp}
const texts=[textSprite(['THE WEB','IS NOT FLAT.'],-58,5.0,.85),textSprite(['CODE CAN CREATE','WORLDS.'],-130,5.4,.9),textSprite(['JOBOSU','DIGITAL TECHNOLOGY LAB'],-184,5.7,.95)];

// Atmospheric dust — cheap points rather than volumetric simulation.
const count=mobile?300:650,pos=new Float32Array(count*3);for(let i=0;i<count;i++){pos[i*3]=(seeded(i+1700)-.5)*42;pos[i*3+1]=seeded(i+1800)*9;pos[i*3+2]=12-seeded(i+1900)*215}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xd9e4d7,size:mobile?.035:.045,transparent:true,opacity:.28,depthWrite:false}));scene.add(dust);

// Soft sun disc.
const disc=new THREE.Mesh(new THREE.CircleGeometry(3.1,32),new THREE.MeshBasicMaterial({color:0xffd29a,transparent:true,opacity:0,depthWrite:false}));disc.position.set(-8,15,-196);scene.add(disc);

let progress=0,px=0,py=0; addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5},{passive:true});
function scroll(){const m=document.documentElement.scrollHeight-innerHeight;progress=m?scrollY/m:0;document.querySelector('#bar').style.width=progress*100+'%';document.querySelector('#phase').textContent=progress<.28?'FOREST // ENTRY':progress<.62?'FOREST // MIST':progress<.86?'FOREST // LIGHT':'FOREST // EXIT'} addEventListener('scroll',scroll,{passive:true});scroll();
function fadeAt(p,c,w){return THREE.MathUtils.clamp(1-Math.abs(progress-c)/w,0,1)}
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const time=clock.getElapsedTime(),z=16-progress*202,x=reduced?0:px*1.35;camera.position.x+=(x-camera.position.x)*.025;camera.position.z+=(z-camera.position.z)*.035;const gy=h(camera.position.x,camera.position.z+94);camera.position.y+=(gy+3.15-py*.35-camera.position.y)*.04;camera.lookAt(camera.position.x*.08,camera.position.y-.18,camera.position.z-18);
 const warmth=THREE.MathUtils.smoothstep(progress,.48,.96);scene.background.lerpColors(cold,warm,warmth);scene.fog.color.lerpColors(cold,warm,warmth);scene.fog.density=(mobile?.032:.027)-fadeAt(progress,.58,.28)*.006;sun.intensity=1.6+warmth*3.1;sun.color.setRGB(1,.66+.18*warmth,.42+.18*warmth);renderer.toneMappingExposure=.7+warmth*.34;disc.material.opacity=THREE.MathUtils.smoothstep(progress,.70,.96)*.68;disc.lookAt(camera.position);
 texts[0].material.opacity=fadeAt(progress,.31,.13);texts[1].material.opacity=fadeAt(progress,.67,.13);texts[2].material.opacity=fadeAt(progress,.93,.10);dust.position.x=Math.sin(time*.08)*1.4;dust.position.y=Math.sin(time*.11)*.12;renderer.render(scene,camera)}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.25:1.6))});
setTimeout(()=>{const l=document.querySelector('#loader');l.style.opacity='0';setTimeout(()=>l.remove(),850)},250);
</script>
</body></html>
