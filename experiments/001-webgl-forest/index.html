<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

<body>

<div id="loader">
    BUILDING FOREST
    <div id="loadbar">
        <div id="loadprogress"></div>
    </div>
    <div id="error"></div>
</div>

<div id="ui">
    <div id="topline"></div>

    <div id="brand">
        JOBOSU // EXP 001<br>
        <span class="live">● REALTIME WEBGL ENVIRONMENT</span>
    </div>

    <div id="assets">
        3D ASSETS: QUATERNIUS · CC0
    </div>

    <div id="phase">
        FOREST // ENTRY
    </div>

    <div id="scroll">
        SCROLL ↓
    </div>
</div>


<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ============================================================
   BASIC CONFIG
============================================================ */

const mobile =
    window.innerWidth < 800 ||
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111914);

/*
    REAL atmospheric depth.
    Objects progressively disappear into the forest.
*/
scene.fog = new THREE.FogExp2(
    0x718078,
    mobile ? 0.018 : 0.014
);

const camera = new THREE.PerspectiveCamera(
    mobile ? 67 : 60,
    window.innerWidth / window.innerHeight,
    0.1,
    360
);

camera.position.set(0, 4.2, 18);


/* ============================================================
   RENDERER
============================================================ */

const renderer = new THREE.WebGLRenderer({
    antialias: !mobile,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        mobile ? 1.25 : 1.7
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 0.78;

renderer.shadowMap.enabled = !mobile;

if (!mobile) {
    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;
}

document.body.prepend(
    renderer.domElement
);


/* ============================================================
   LIGHT
============================================================ */

/*
    Cool ambient forest light.
*/
const hemi = new THREE.HemisphereLight(
    0xa9b9ad,
    0x10140d,
    0.72
);

scene.add(hemi);


/*
    Warm low sun from the side.
*/
const sunLight =
    new THREE.DirectionalLight(
        0xffc47c,
        mobile ? 2.0 : 2.8
    );

sunLight.position.set(
    38,
    34,
    -95
);

sunLight.target.position.set(
    0,
    3,
    -120
);

scene.add(sunLight);
scene.add(sunLight.target);


if (!mobile) {

    sunLight.castShadow = true;

    sunLight.shadow.mapSize.set(
        1024,
        1024
    );

    sunLight.shadow.camera.left = -35;
    sunLight.shadow.camera.right = 35;
    sunLight.shadow.camera.top = 35;
    sunLight.shadow.camera.bottom = -35;

    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 150;
}


/* ============================================================
   TERRAIN
============================================================ */

function terrainHeight(x, z) {

    return (
        Math.sin(x * 0.095) * 0.75 +
        Math.cos(z * 0.055) * 0.8 +
        Math.sin((x + z) * 0.035) * 0.6
    );
}


const terrainGeo =
    new THREE.PlaneGeometry(
        105,
        265,
        75,
        150
    );

terrainGeo.rotateX(
    -Math.PI / 2
);

const terrainPos =
    terrainGeo.attributes.position;

for (
    let i = 0;
    i < terrainPos.count;
    i++
) {

    const x = terrainPos.getX(i);
    const z = terrainPos.getZ(i);

    /*
        Create a subtle valley/path
        through the middle.
    */

    const valley =
        Math.exp(
            -(x * x) / 48
        ) * -0.8;

    const y =
        terrainHeight(x, z) +
        valley;

    terrainPos.setY(i, y);
}

terrainGeo.computeVertexNormals();


const terrainMat =
    new THREE.MeshStandardMaterial({
        color: 0x263023,
        roughness: 1,
        metalness: 0
    });


const terrain =
    new THREE.Mesh(
        terrainGeo,
        terrainMat
    );

terrain.position.z = -105;

terrain.receiveShadow = true;

scene.add(terrain);


/* ============================================================
   PATH
============================================================ */

const pathGeo =
    new THREE.PlaneGeometry(
        5.5,
        230,
        1,
        80
    );

pathGeo.rotateX(-Math.PI / 2);

const pathMat =
    new THREE.MeshStandardMaterial({
        color: 0x342d22,
        roughness: 1
    });

const path =
    new THREE.Mesh(
        pathGeo,
        pathMat
    );

path.position.set(
    0,
    -0.42,
    -102
);

scene.add(path);


/* ============================================================
   SUN DISC
============================================================ */

const sunMat =
    new THREE.SpriteMaterial({
        color: 0xffd59b,
        transparent: true,
        opacity: .82,
        depthWrite: false
    });

const sun =
    new THREE.Sprite(
        sunMat
    );

sun.position.set(
    28,
    29,
    -150
);

sun.scale.set(
    12,
    12,
    1
);

scene.add(sun);


/* ============================================================
   LOADING
============================================================ */

const loadingManager =
    new THREE.LoadingManager();

const loadProgress =
    document.getElementById(
        "loadprogress"
    );

loadingManager.onProgress =
(url, loaded, total) => {

    loadProgress.style.width =
        `${(loaded / total) * 100}%`;
};


const gltfLoader =
    new GLTFLoader(
        loadingManager
    );


function loadGLTF(url) {

    return new Promise(
        (resolve, reject) => {

            gltfLoader.load(
                url,
                gltf => resolve(
                    gltf.scene
                ),
                undefined,
                reject
            );

        }
    );
}


/* ============================================================
   SEEDED RANDOM
============================================================ */

let seed = 918273;

function random() {

    seed =
        (seed * 16807) %
        2147483647;

    return (
        seed - 1
    ) / 2147483646;
}


function rand(min, max) {

    return (
        min +
        random() *
        (max - min)
    );
}


/* ============================================================
   MODEL HELPERS
============================================================ */

function prepareModel(
    model,
    shadows = false
) {

    model.traverse(
        child => {

            if (child.isMesh) {

                child.castShadow =
                    shadows &&
                    !mobile;

                child.receiveShadow =
                    shadows &&
                    !mobile;

                /*
                    Avoid overly shiny
                    stylized materials.
                */

                if (child.material) {

                    child.material =
                        child.material.clone();

                    child.material.roughness =
                        1;

                    child.material.metalness =
                        0;
                }
            }
        }
    );

    return model;
}


function cloneModel(model) {

    return model.clone(true);
}


/* ============================================================
   FOREST
============================================================ */

async function buildForest() {

try {

const [

    pine1,
    pine3,
    pine5,
    fern,
    grass,
    rock1,
    rock2

] = await Promise.all([

    loadGLTF(
        "./assets/Pine_1.gltf"
    ),

    loadGLTF(
        "./assets/Pine_3.gltf"
    ),

    loadGLTF(
        "./assets/Pine_5.gltf"
    ),

    loadGLTF(
        "./assets/Fern_1.gltf"
    ),

    loadGLTF(
        "./assets/Grass_Common_Short.gltf"
    ),

    loadGLTF(
        "./assets/Rock_Medium_1.gltf"
    ),

    loadGLTF(
        "./assets/Rock_Medium_2.gltf"
    )

]);


const trees = [
    prepareModel(pine1, true),
    prepareModel(pine3, true),
    prepareModel(pine5, true)
];

prepareModel(fern);
prepareModel(grass);

prepareModel(rock1, true);
prepareModel(rock2, true);


/* ============================================================
   FOREGROUND TREES
============================================================ */

/*
    Large trees close to camera.
    These are extremely important:
    they frame the image and create scale.
*/

const foregroundTrees =
mobile ? 6 : 10;

for (
    let i = 0;
    i < foregroundTrees;
    i++
) {

    const side =
        i % 2 === 0
            ? -1
            : 1;

    const tree =
        cloneModel(
            trees[
                Math.floor(
                    random() *
                    trees.length
                )
            ]
        );

    const x =
        side *
        rand(8, 18);

    const z =
        rand(
            -10,
            -48
        );

    tree.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ),
        z
    );

    const scale =
        rand(
            2.8,
            4.8
        );

    tree.scale.setScalar(
        scale
    );

    tree.rotation.y =
        rand(
            0,
            Math.PI * 2
        );

    scene.add(tree);
}


/* ============================================================
   MAIN FOREST
============================================================ */

const treeCount =
    mobile ? 115 : 210;

for (
    let i = 0;
    i < treeCount;
    i++
) {

    const tree =
        cloneModel(
            trees[
                Math.floor(
                    random() *
                    trees.length
                )
            ]
        );

    const z =
        rand(
            -25,
            -225
        );

    /*
        Keep central path
        partially clear.
    */

    let x;

    if (
        random() < .68
    ) {

        const side =
            random() < .5
                ? -1
                : 1;

        x =
            side *
            rand(
                5,
                36
            );

    } else {

        x =
            rand(
                -42,
                42
            );
    }


    const distance =
        Math.abs(z);


    let scale;

    if (distance < 70) {

        scale =
            rand(
                1.45,
                2.7
            );

    } else {

        scale =
            rand(
                1.1,
                2.3
            );
    }


    tree.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ),
        z
    );

    tree.scale.setScalar(
        scale
    );

    tree.rotation.y =
        rand(
            0,
            Math.PI * 2
        );

    scene.add(tree);
}


/* ============================================================
   DISTANT FOREST
============================================================ */

/*
    Smaller models in background.
    Fog hides detail and creates
    apparent density.
*/

const distantCount =
    mobile ? 70 : 150;

for (
    let i = 0;
    i < distantCount;
    i++
) {

    const tree =
        cloneModel(
            trees[
                Math.floor(
                    random() *
                    trees.length
                )
            ]
        );

    const x =
        rand(
            -65,
            65
        );

    const z =
        rand(
            -165,
            -270
        );

    tree.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ),
        z
    );

    tree.scale.setScalar(
        rand(
            .7,
            1.7
        )
    );

    tree.rotation.y =
        rand(
            0,
            Math.PI * 2
        );

    scene.add(tree);
}


/* ============================================================
   FERNS
============================================================ */

const fernCount =
    mobile ? 100 : 240;

for (
    let i = 0;
    i < fernCount;
    i++
) {

    const f =
        cloneModel(
            fern
        );

    const z =
        rand(
            -8,
            -215
        );

    let x =
        rand(
            -32,
            32
        );

    /*
        More vegetation near
        the edges of the path.
    */

    if (
        Math.abs(x) < 3
    ) {

        x +=
            x < 0
                ? -3
                : 3;
    }

    f.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ) + .02,
        z
    );

    const s =
        rand(
            .55,
            1.7
        );

    f.scale.setScalar(s);

    f.rotation.y =
        rand(
            0,
            Math.PI * 2
        );

    scene.add(f);
}


/* ============================================================
   GRASS
============================================================ */

const grassCount =
    mobile ? 100 : 260;

for (
    let i = 0;
    i < grassCount;
    i++
) {

    const g =
        cloneModel(
            grass
        );

    const x =
        rand(
            -35,
            35
        );

    const z =
        rand(
            -8,
            -220
        );

    g.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ),
        z
    );

    g.scale.setScalar(
        rand(
            .5,
            1.5
        )
    );

    g.rotation.y =
        rand(
            0,
            Math.PI * 2
        );

    scene.add(g);
}


/* ============================================================
   ROCKS
============================================================ */

const rocks =
    [rock1, rock2];

const rockCount =
    mobile ? 28 : 55;

for (
    let i = 0;
    i < rockCount;
    i++
) {

    const rock =
        cloneModel(
            rocks[
                Math.floor(
                    random() *
                    rocks.length
                )
            ]
        );

    let x =
        rand(
            -30,
            30
        );

    const z =
        rand(
            -5,
            -210
        );

    if (
        Math.abs(x) < 2.8
    ) {

        x +=
            x < 0
                ? -3
                : 3;
    }

    rock.position.set(
        x,
        terrainHeight(
            x,
            z + 105
        ) - .1,
        z
    );

    rock.scale.setScalar(
        rand(
            .7,
            2.4
        )
    );

    rock.rotation.y =
        rand(
            0,
            Math.PI * 2
        );

    scene.add(rock);
}


/* ============================================================
   LOADER FINISHED
============================================================ */

document
    .getElementById("loader")
    .style
    .display = "none";


} catch(error) {

    console.error(error);

    document
        .getElementById("error")
        .textContent =
        "FOREST LOAD ERROR — " +
        error.message;
}

}


/* ============================================================
   FOG BANKS
============================================================ */

/*
    These are transparent vertical planes,
    not expensive true volumetric fog.

    Several overlapping layers create
    visible moving mist.
*/

const fogTexture =
    createFogTexture();

function createFogTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;
    canvas.height = 256;

    const ctx =
        canvas.getContext(
            "2d"
        );

    const gradient =
        ctx.createRadialGradient(
            256,
            128,
            10,
            256,
            128,
            245
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,.58)"
    );

    gradient.addColorStop(
        .35,
        "rgba(235,245,240,.32)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        512,
        256
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    return texture;
}


const fogBanks = [];

const fogCount =
    mobile ? 14 : 28;

for (
    let i = 0;
    i < fogCount;
    i++
) {

    const material =
        new THREE.MeshBasicMaterial({

            map: fogTexture,

            transparent: true,

            opacity:
                rand(
                    .045,
                    .13
                ),

            depthWrite: false,

            blending:
                THREE.NormalBlending,

            side:
                THREE.DoubleSide
        });


    const plane =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                rand(28, 55),
                rand(8, 18)
            ),

            material
        );


    plane.position.set(

        rand(
            -25,
            25
        ),

        rand(
            2,
            8
        ),

        rand(
            -25,
            -220
        )

    );


    plane.rotation.y =
        rand(
            -.2,
            .2
        );


    plane.userData.speed =
        rand(
            .03,
            .09
        );


    plane.userData.baseX =
        plane.position.x;


    plane.userData.offset =
        rand(
            0,
            Math.PI * 2
        );


    fogBanks.push(
        plane
    );

    scene.add(
        plane
    );
}


/* ============================================================
   LIGHT SHAFTS
============================================================ */

function createLightShaft(
    x,
    y,
    z,
    rotation
) {

    const geometry =
        new THREE.ConeGeometry(
            9,
            65,
            24,
            1,
            true
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0xffd6a0,

            transparent:
                true,

            opacity:
                mobile
                    ? .018
                    : .028,

            depthWrite:
                false,

            side:
                THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending
        });


    const shaft =
        new THREE.Mesh(
            geometry,
            material
        );


    shaft.position.set(
        x,
        y,
        z
    );


    shaft.rotation.z =
        rotation;


    scene.add(
        shaft
    );


    return shaft;
}


const shafts = [

    createLightShaft(
        23,
        24,
        -105,
        -.36
    ),

    createLightShaft(
        29,
        22,
        -135,
        -.42
    ),

    createLightShaft(
        19,
        20,
        -165,
        -.32
    )

];


/* ============================================================
   PARTICLES
============================================================ */

const particleCount =
    mobile ? 220 : 600;

const particleGeo =
    new THREE.BufferGeometry();

const particlePositions =
    new Float32Array(
        particleCount * 3
    );


for (
    let i = 0;
    i < particleCount;
    i++
) {

    particlePositions[
        i * 3
    ] =
        rand(
            -35,
            35
        );

    particlePositions[
        i * 3 + 1
    ] =
        rand(
            .5,
            16
        );

    particlePositions[
        i * 3 + 2
    ] =
        rand(
            -10,
            -210
        );
}


particleGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);


const particleMat =
    new THREE.PointsMaterial({

        color:
            0xffe6ba,

        size:
            mobile
                ? .055
                : .075,

        transparent:
            true,

        opacity:
            .3,

        depthWrite:
            false
    });


const particles =
    new THREE.Points(
        particleGeo,
        particleMat
    );


scene.add(
    particles
);


/* ============================================================
   TEXT INSIDE WORLD
============================================================ */

function createWorldText(
    lines,
    z,
    y,
    scale = 1
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 1024;
    canvas.height = 300;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "bold 56px monospace";

    ctx.fillStyle =
        "rgba(235,240,235,.76)";


    const lineArray =
        lines.split("\n");


    lineArray.forEach(
        (line, index) => {

            ctx.fillText(
                line,
                512,
                105 +
                index * 72
            );

        }
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    const material =
        new THREE.SpriteMaterial({

            map:
                texture,

            transparent:
                true,

            depthTest:
                true,

            depthWrite:
                false,

            opacity:
                .82
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.position.set(
        0,
        y,
        z
    );


    sprite.scale.set(
        17 * scale,
        5 * scale,
        1
    );


    scene.add(
        sprite
    );


    return sprite;
}


const text1 =
    createWorldText(
        "THE WEB\nIS NOT FLAT.",
        -62,
        6.5,
        1
    );


const text2 =
    createWorldText(
        "CODE CAN CREATE\nWORLDS.",
        -126,
        7,
        1
    );


const text3 =
    createWorldText(
        "JOBOSU\nDIGITAL TECHNOLOGY LAB",
        -190,
        7,
        1.05
    );


/* ============================================================
   SCROLL
============================================================ */

let scrollTarget = 0;
let scrollCurrent = 0;


window.addEventListener(
    "wheel",
    event => {

        scrollTarget +=
            event.deltaY *
            .00065;

        scrollTarget =
            THREE.MathUtils.clamp(
                scrollTarget,
                0,
                1
            );

    },
    {
        passive: true
    }
);


/*
    Mobile touch navigation
*/

let touchY = null;

window.addEventListener(
    "touchstart",
    event => {

        touchY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


window.addEventListener(
    "touchmove",
    event => {

        if (
            touchY === null
        ) return;


        const y =
            event.touches[0].clientY;


        const delta =
            touchY - y;


        scrollTarget +=
            delta * .002;


        scrollTarget =
            THREE.MathUtils.clamp(
                scrollTarget,
                0,
                1
            );


        touchY = y;

    },
    {
        passive: true
    }
);


/* ============================================================
   POINTER PARALLAX
============================================================ */

let mouseX = 0;
let mouseY = 0;


window.addEventListener(
    "pointermove",
    event => {

        mouseX =
            (
                event.clientX /
                window.innerWidth
                -
                .5
            );

        mouseY =
            (
                event.clientY /
                window.innerHeight
                -
                .5
            );

    }
);


/* ============================================================
   PHASE UI
============================================================ */

const phaseLabel =
    document.getElementById(
        "phase"
    );


function updatePhase(t) {

    if (t < .23) {

        phaseLabel.textContent =
            "FOREST // ENTRY";

    } else if (t < .52) {

        phaseLabel.textContent =
            "FOREST // MIST";

    } else if (t < .78) {

        phaseLabel.textContent =
            "FOREST // LIGHT";

    } else {

        phaseLabel.textContent =
            "FOREST // EXIT";

    }
}


/* ============================================================
   ANIMATION
============================================================ */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const elapsed =
        clock.getElapsedTime();


    /*
        Smooth scroll.
    */

    scrollCurrent +=
        (
            scrollTarget -
            scrollCurrent
        ) * .045;


    const t =
        scrollCurrent;


    /*
        Camera travels almost 200m
        through the forest.
    */

    camera.position.z =
        THREE.MathUtils.lerp(
            18,
            -198,
            t
        );


    /*
        Subtle side movement.
    */

    camera.position.x =
        Math.sin(
            t *
            Math.PI *
            4
        ) *
        1.15
        +
        mouseX *
        .65;


    camera.position.y =
        4.1
        +
        Math.sin(
            t *
            Math.PI *
            6
        ) *
        .28
        -
        mouseY *
        .18;


    camera.rotation.y =
        mouseX *
        -.025;


    camera.rotation.x =
        mouseY *
        -.012;


    /*
        Moving mist.
    */

    fogBanks.forEach(
        (fog, index) => {

            fog.position.x =
                fog.userData.baseX +
                Math.sin(
                    elapsed *
                    fog.userData.speed +
                    fog.userData.offset
                ) *
                5;


            fog.material.opacity =
                (
                    .055 +
                    Math.sin(
                        elapsed *
                        .12 +
                        index
                    ) *
                    .025
                );

        }
    );


    /*
        Dust movement.
    */

    particles.rotation.y =
        Math.sin(
            elapsed *
            .025
        ) *
        .025;


    /*
        Sun becomes warmer
        deeper in scene.
    */

    sunLight.intensity =
        THREE.MathUtils.lerp(
            mobile
                ? 1.8
                : 2.3,

            mobile
                ? 2.7
                : 3.6,

            t
        );


    renderer.toneMappingExposure =
        THREE.MathUtils.lerp(
            .68,
            .9,
            t
        );


    /*
        Fog evolves through journey.
    */

    scene.fog.density =
        .014 +
        Math.sin(
            t *
            Math.PI
        ) *
        .008;


    updatePhase(t);


    renderer.render(
        scene,
        camera
    );
}


buildForest();

animate();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
