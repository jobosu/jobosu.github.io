<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JOBOSU // Particle Ecosystem</title><style>
:root{color-scheme:dark;font-family:ui-monospace,Menlo,Consolas,monospace;background:#080d12;color:#d7e8e6}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:1.1rem;letter-spacing:.12em;margin:0}p{color:#92a8ab;font-size:.82rem}main{padding:0 20px 20px}canvas{width:100%;height:min(70vh,700px);display:block;border:1px solid #28424b;border-radius:8px;background:#071017;touch-action:none}aside{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:14px 0}button{background:#142b34;border:1px solid #3d6871;color:#d9f4f0;border-radius:5px;padding:10px 14px;cursor:pointer}button:focus-visible{outline:2px solid #b7f9d0}label{font-size:.8rem;color:#b8d2d3}input{accent-color:#78e4b5}#status{font-size:.8rem;color:#94b7bb}footer{padding:0 24px 24px;color:#799397;font-size:.75rem}
</style></head><body><header><div><h1>JOBOSU // PARTICLE ECOSYSTEM</h1><p>EXP 001 · emergència / atracció / repulsió</p></div><div id="status" role="status" aria-live="polite"></div></header><main><canvas aria-label="Simulació interactiva de partícules; toca per atreure-les"></canvas><aside><button id="toggle">Pausa</button><button id="reset">Reinicia</button><label>Partícules <input id="count" type="range" min="60" max="300" step="20" value="160"><output id="countValue">160</output></label><label>Velocitat <input id="speed" type="range" min="20" max="160" value="75"><output id="speedValue">75</output></label></aside><p>Arrossega el dit o el cursor per crear un focus d'atracció. Tres espècies interactuen amb regles cícliques.</p></main><footer>Sense biblioteques, dades personals ni connexions externes.</footer><script src="simulation.js"></script></body></html>
