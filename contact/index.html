<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CONTACT // JOBOSU</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>JOBOSU // CONTACT</h1>
        <p class="status">● SYSTEM ONLINE</p>
    </header>

    <section>

        <form action="https://formspree.io/f/xzezdgjl" method="POST">

            <p>
                <label>
                    NAME<br>
                    <input type="text" name="name" required>
                </label>
            </p>

            <p>
                <label>
                    EMAIL<br>
                    <input type="email" name="email" required>
                </label>
            </p>

            <p>
                <label>
                    MESSAGE<br>
                    <textarea name="message" rows="8" required></textarea>
                </label>
            </p>

            <p>
                <button type="submit">[ SEND MESSAGE ]</button>
            </p>

        </form>

    </section>

    <footer>
        <p>
            <a href="../">← BACK TO JOBOSU</a>
        </p>
    </footer>

</body>

</html>
